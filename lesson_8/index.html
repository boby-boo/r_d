<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
  </head>
  <body>
    <div class="container">
      <div class="tasks-container">
        <ul class="tasks-list">
          <li class="task-item">
              <h2 class="task-title">Task Title</h2>
              <div class="task-description">
                Lorem ipsum dolor sit amet consectetur adipisicing elit. Quisquam, quos.
              </div>
              <div class="task-info">
                <div class="task-created-at">Created at: <span>2025-01-01</span></div>
                <div class="task-status">Status: <span>Todo</span></div>
                <div class="task-priority">Priority: <span>Low</span></div>
                <div class="task-deadline">Deadline: <span>2025-01-01</span></div>
              </div>
              <div class="task-actions">
                <button class="task-action">Edit</button>
                <button class="task-action">Delete</button>
            </div>
          </li>
        </ul>
        <form id="task-form" class="task-form">
          <div class="input-field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" required />
          </div>
          <div class="input-field">
            <label for="description">Description</label>
            <textarea name="description" id="description" required></textarea>
          </div>
          <div class="input-field">
            <label for="status">Status</label>
            <select name="status" id="status" required>
              <option value="todo">Todo</option>
              <option value="in_progress">In Progress</option>
              <option value="done">Done</option>
            </select>
          </div>
          <div class="input-field">
            <label for="priority">Priority</label>
            <select name="priority" id="priority" required>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="input-field">
            <label for="deadline">Deadline</label>
            <input type="date" id="deadline" name="deadline" required />
          </div>
          <button data-action="submit-button" class="btn-primary"> Add Task</button>
          <button data-action="reset-button" class="btn-secondary">Reset Form</button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
